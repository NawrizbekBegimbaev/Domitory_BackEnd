# /etc/nginx/sites-available/dormitory
# Cloudflare терминирует HTTPS для пользователей и в режиме Full подключается к серверу по 443.
# На 443 стоит self-signed сертификат (создаётся setup_server.sh) — для режима Full этого достаточно.
# Для Full (strict) заменить его на Cloudflare Origin Certificate в /etc/nginx/ssl/.

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/dormitory.crt;
    ssl_certificate_key /etc/nginx/ssl/dormitory.key;
    server_name begimbaev-dormitory.uk www.begimbaev-dormitory.uk _;

    client_max_body_size 20M;

    # React build
    root /home/dormitory/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django API + admin + schema
    location ~ ^/(api|admin|schema)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /home/dormitory/backend/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /home/dormitory/backend/media/;
        expires 7d;
    }
}
